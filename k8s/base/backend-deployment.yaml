apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: noteapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: notes-app-backend:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: noteapp-config
                  key: PORT

            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: noteapp-config
                  key: NODE_ENV

            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notes-app-secret
                  key: MONGO_USER

            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notes-app-secret
                  key: MONGO_PASS

            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: notes-app-secret
                  key: MONGODB_URI

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 250m
              memory: 256Mi
