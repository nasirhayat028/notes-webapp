sonar.projectKey=notes-app
sonar.projectName=Notes App
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Pure project ki base directory se sources uthayein
sonar.sources=frontend/src,backend

# Inclusions aur Exclusions specify karein taake scanner confuse na ho
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.ts,**/*.test.js,**/*.spec.ts

# Absolute/Relative mapping ko ensure karne ke liye exact paths
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
