name: Notes App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --run
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test backend
        run: npm test -- --run

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || echo "Vulnerabilities found but continuing"
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high || echo "Vulnerabilities found but continuing"

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dependency-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Coverage
        run: |
          cd frontend && npm ci && npm run coverage || echo "No coverage script"
          cd ../backend && npm ci && npm run coverage || echo "No coverage script"
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3.1.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.ws.timeout=600
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://warned-eds-mambo-hub.trycloudflare.com 

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://warned-eds-mambo-hub.trycloudflare.com   

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: sonarqube
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Images Locally
        run: |
          docker build -t notes-frontend:build-${{ github.run_number }} ./frontend
          docker build -t notes-backend:build-${{ github.run_number }} ./backend
      
      # Images ko tar file mein save karna taake aglay jobs use kar sakein
      - name: Archive Docker Images
        run: |
          docker save notes-frontend:build-${{ github.run_number }} -o frontend-image.tar
          docker save notes-backend:build-${{ github.run_number }} -o backend-image.tar
      
      - name: Upload Images as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-archive
          path: |
            frontend-image.tar
            backend-image.tar
          retention-days: 1

  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Download Built Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-archive
      
      # Wahi tar files se images ko is computer par load karna
      - name: Load Archived Docker Images
        run: |
          docker load -i frontend-image.tar
          docker load -i backend-image.tar
      
      - name: Run Trivy Scan on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'notes-frontend:build-${{ github.run_number }}'
          scan-type: 'image'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Agar exit-code: '1' karenge to dangerous bugs par pipeline push tak nahi jaye gi

      - name: Run Trivy Scan on Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'notes-backend:build-${{ github.run_number }}'
          scan-type: 'image'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

  docker-push:
    name: Docker Push Registry
    runs-on: ubuntu-latest
    needs: trivy-scan
    steps:
      - name: Download Built Images
        uses: actions/download-artifact@v4
        with:
          name: docker-images-archive
      
      - name: Load Archived Docker Images
        run: |
          docker load -i frontend-image.tar
          docker load -i backend-image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      # Wahi original local image ko Docker Hub repository ke tag ke sath push karna
      - name: Tag and Push Images
        run: |
          docker tag notes-frontend:build-${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/notes-frontend:build-${{ github.run_number }}
          docker tag notes-backend:build-${{ github.run_number }} ${{ secrets.DOCKER_USERNAME }}/notes-backend:build-${{ github.run_number }}
          
          docker push ${{ secrets.DOCKER_USERNAME }}/notes-frontend:build-${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/notes-backend:build-${{ github.run_number }}

  gitops-deploy:
    name: GitOps Sync Deployment
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: .*/notes-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:build-${{ github.run_number }}|" k8s/base/frontend-deployment.yaml
          sed -i "s|image: .*/notes-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/notes-backend:build-${{ github.run_number }}|" k8s/base/backend-deployment.yaml
      - name: Commit manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add k8s/base/frontend-deployment.yaml k8s/base/backend-deployment.yaml
          git commit -m "Update images to build-${{ github.run_number }}" || echo "No changes"
          git push
