name: Notes App CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
      name: SonarQube Analysis
      runs-on: ubuntu-latest

      # Self-hosted runner ko sirf trusted main pushes par use karna
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'


      needs:
        - frontend
        - backend
        - gitleaks

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

         # Step 1: Setup Node.js self-hosted runner par taake tests chal sakein
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22

        # Step 2: Frontend ki dependencies install karke coverage report banana
        - name: Generate Frontend Coverage
          run: |
            cd frontend
            npm ci
            npm run coverage

        # Step 3: Backend ki dependencies install karke coverage report banana
        - name: Generate Backend Coverage
          run: |
            cd backend
            npm ci
            npm run coverage

        - name: SonarQube Scan
          uses: SonarSource/sonarqube-scan-action@v5
          with:
            projectBaseDir: .
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: https://catchable-premium-document.ngrok-free.dev
            SONAR_SCANNER_SKIP_JRE_PROVISIONING: true


      
        - name: SonarQube Quality Gate
          id: quality-gate
          uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
          with:
           pollingTimeoutSec: 600
          env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL:  https://catchable-premium-document.ngrok-free.dev

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - frontend
      - backend
      - gitleaks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Frontend Coverage
        run: |
          cd frontend
          npm ci
          npm run coverage

      - name: Generate Backend Coverage
        run: |
          cd backend
          npm ci
          npm run coverage

        # Version v5 ko badal kar v3.1.0 kiya jo binary compatibility issues ko fix karega
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3.1.0
        with:
          projectBaseDir: .
          args: >
            -Dsonar.ws.timeout=600
            -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://catchable-premium-document.ngrok-free.dev
      
      - name: SonarQube Quality Gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://catchable-premium-document.ngrok-free.dev

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    needs:
      - frontend
      - backend
      - sonarqube
      - gitleaks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:build-${{ github.run_number }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/notes-backend:build-${{ github.run_number }}

      - name: Update Kubernetes manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sed -i "s|image: .*/notes-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/notes-frontend:build-${{ github.run_number }}|" k8s/base/frontend-deployment.yaml
          sed -i "s|image: .*/notes-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/notes-backend:build-${{ github.run_number }}|" k8s/base/backend-deployment.yaml

      - name: Commit manifest changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/frontend-deployment.yaml k8s/base/backend-deployment.yaml
          git commit -m "Update images to build-${{ github.run_number }}" || echo "No changes to commit"
          git push
